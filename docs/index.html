<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoL Esports Dashboard</title>
  <link rel="icon" href="/favicon.svg?v=20260526-lmark-left" type="image/svg+xml">
  <link rel="stylesheet" href="static/styles.css?v=header-favicon-logo-1">
</head>
<body>
  <header class="siteHeader">
    <nav class="siteHeaderInner" aria-label="Main navigation">
      <a class="siteBrand" href="/">
        <img class="siteBrandMark" src="/favicon.svg" alt="" aria-hidden="true">
        <span>LoL Predictor</span>
      </a>
      <div class="siteNav">
        <a class="siteNavLink active" href="/" aria-current="page">Home</a>
        <a class="siteNavLink siteNavLinkCta" href="/rtprob/">Draft Lab</a>
        <a class="siteNavLink" href="/player-features/">Draft Lens</a>
      </div>
    </nav>
  </header>
  <main class="shell">
    <section class="dashboardHead">
      <div class="dashboardTitleBlock">
        <h1>LoL Esports Dashboard</h1>
        <p id="meta">loading...</p>
        <p id="opsMeta" class="opsMeta"></p>
      </div>
      <div class="filters dashboardFilters">
        <select id="leagueGroup">
          <option value="all">All tiers</option>
          <option value="major" selected>Major</option>
          <option value="secondary">Secondary</option>
          <option value="event">Events</option>
        </select>
        <select id="region">
          <option value="all">All regions</option>
          <option value="korea">Korea</option>
          <option value="china">China</option>
          <option value="emea">EMEA</option>
          <option value="americas">Americas</option>
          <option value="pacific">Pacific</option>
          <option value="international">International</option>
        </select>
      </div>
    </section>

    <section class="matchStrip panel">
      <div class="sectionHead">
        <div>
          <h2>Matches</h2>
          <p id="matchSource">loading...</p>
        </div>
        <div class="matchScheduleTools">
          <input id="scheduleDate" class="scheduleDate" type="date" aria-label="Schedule date">
        </div>
      </div>
      <div id="dateTabs" class="dateTabs"></div>
      <div id="matches" class="matches"></div>
    </section>

    <section id="matchCenter" class="matchCenter panel">
      <div class="sectionHead">
        <div>
          <h2>Match Center</h2>
          <p id="selectedMatchMeta">Select a match to preview match context.</p>
        </div>
        
      </div>
      <div id="selectedMatch" class="selectedMatch"></div>
      <div id="selectedPredictionPanel" class="predictionPanel hidden"></div>
      <div id="gameList" class="gameList"></div>
    </section>

    <section class="grid">

      <section class="panel">
        <div class="panelTitleRow championMetaTitleRow">
          <div>
            <h2>Latest Data Patch Meta</h2>
            <p id="championMetaSub" class="subtleText">All roles</p>
          </div>
          <div class="panelControls">
            <select id="championMetaGroup" class="compactSelect" aria-label="Champion meta tier">
              <option value="all" selected>All tiers</option>
              <option value="major">Major</option>
              <option value="secondary">Secondary</option>
            </select>
            <select id="championPatch" class="compactSelect" aria-label="Champion meta patch">
              <option value="all">ALL</option>
            </select>
            <select id="championRole" class="compactSelect" aria-label="Champion meta role">
              <option value="all">All</option>
              <option value="top">Top</option>
              <option value="jng">Jungle</option>
              <option value="mid">Mid</option>
              <option value="bot">Bot</option>
              <option value="sup">Support</option>
            </select>
          </div>
        </div>
        <div id="champions" class="table"></div>
      </section>

      <section class="panel standingsPanel">
        <div class="panelTitleRow">
          <div>
            <h2>Regional Team Standings</h2>
            <p id="teamStandingsMeta" class="subtleText">Latest patch team-game results</p>
          </div>
          <select id="teamLeague" class="compactSelect" aria-label="Team standings league">
            <option value="league:LCK">LCK</option>
          </select>
        </div>
        <div id="teams" class="table standingsTable"></div>
      </section>
    </section>
  </main>
  <script>window.STATIC_SITE = true;</script>
  <script src="static/app.js?v=cloudflare-schedule-20260802"></script>
  <script src="static/champion_meta_patch_filter.js?v=header-favicon-logo-1"></script>
</body>
</html>
