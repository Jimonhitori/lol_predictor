<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Detail - LoL Esports Dashboard</title>
  <link rel="stylesheet" href="../static/styles.css?v=team-history-logos-20260525">
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <a class="backLink" href="../index.html">Matches</a>
        <h1 id="matchTitle">Match Detail</h1>
        <p id="matchMeta">loading...</p>
        <p id="opsMeta" class="opsMeta"></p>
      </div>
    </section>

    <section class="panel detailHero">
      <div id="detailTeams" class="selectedMatch"></div>
      <div id="detailPredictionPanel" class="predictionPanel hidden"></div>
      <div id="detailGames" class="gameList"></div>
    </section>

    <section class="panel livePanel">
      <div id="liveBoard" class="liveBoard"></div>
      <p id="liveRefreshMeta" class="liveRefreshMeta">Auto refresh is starting...</p>
    </section>

    <section class="grid detailGrid">
      <section class="panel h2hPanel">
        <div class="historyTabs" role="tablist" aria-label="Match history">
          <button type="button" class="historyTab" data-history-tab="h2h" aria-controls="historyTabH2h">H2H</button>
          <button type="button" class="historyTab active" data-history-tab="recent" aria-controls="historyTabRecent">&#23550;&#25126;&#23653;&#27508;</button>
        </div>
        <div id="historyTabH2h" class="historyTabPanel hidden" data-history-panel="h2h">
          <div id="headToHead" class="h2hList"></div>
        </div>
        <div id="historyTabRecent" class="historyTabPanel" data-history-panel="recent">
          <div id="teamHistory" class="teamHistoryGrid"></div>
        </div>
      </section>
      <section class="panel">
        <h2>Player Rosters</h2>
        <div class="draftGrid">
          <div>
            <h2 id="blueRosterTitle">Blue</h2>
            <div id="blueRoster" class="rosterList"></div>
          </div>
          <div>
            <h2 id="redRosterTitle">Red</h2>
            <div id="redRoster" class="rosterList"></div>
          </div>
        </div>
      </section>
    </section>
  </main>
  <script>window.STATIC_SITE = true;</script>
  <script src="../static/app.js?v=compact-history-tabs-20260525"></script>
</body>
</html>
