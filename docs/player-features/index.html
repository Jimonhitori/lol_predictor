<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draft Lens</title>
  <style>
    :root { color-scheme: dark; --bg:#081017; --panel:#101820; --line:#253241; --text:#edf5ff; --muted:#8fa1b5; --cyan:#16f0c8; --blue:#2e8cff; --red:#ff476d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 50% 0%, rgba(22,240,200,.12), transparent 34rem), var(--bg); color: var(--text); font-family: Inter, Segoe UI, system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line); background: rgba(7,11,16,.96); backdrop-filter: blur(10px); }
    nav { max-width: 1280px; min-height: 56px; margin: 0 auto; padding: 7px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 15px; font-weight: 900; text-decoration: none; white-space: nowrap; }
    .brandLogo { width: 36px; height: 36px; display: block; border-radius: 7px; object-fit: contain; }
    .menu { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 900; }
    .menu a { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; color: #c8d4e2; text-decoration: none; padding: 0 10px; white-space: nowrap; }
    .menu a.active { color: var(--cyan); }
    main { max-width: 1280px; margin: 0 auto; padding: 22px 24px 48px; }
    .head { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin-bottom: 20px; }
    .headActions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .statFilter { min-width: 116px; border: 1px solid var(--line); background: var(--panel); color: #e7f0fb; border-radius: 7px; padding: 9px 10px; font-size: 12px; font-weight: 800; outline: none; }
    .eyebrow { margin: 0 0 8px; color: var(--cyan); font-size: 12px; font-weight: 900; letter-spacing: .28em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); letter-spacing: -.02em; }
    .desc { margin: 8px 0 0; color: var(--muted); font-size: 14px; max-width: 720px; }
    .count { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 9px 12px; color: #c7d3e1; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .layout { display: grid; grid-template-columns: minmax(340px, 1fr) minmax(360px, 400px) minmax(340px, 1fr); gap: 16px; align-items: start; }
    .team { border: 1px solid var(--line); background: rgba(16,24,32,.88); border-radius: 10px; padding: 16px; box-shadow: 0 0 28px rgba(22,240,200,.12); }
    .team.blue { border-color: rgba(46,140,255,.55); background: rgba(46,140,255,.055); }
    .team.red { border-color: rgba(255,71,109,.55); background: rgba(255,71,109,.055); }
    .teamHead { display: flex; justify-content: space-between; gap: 12px; align-items: start; margin-bottom: 14px; }
    .side { margin: 0 0 4px; font-size: 11px; font-weight: 900; letter-spacing: .22em; text-transform: uppercase; }
    .blue .side { color: var(--blue); } .red .side { color: var(--red); }
    h2 { margin: 0; font-size: 22px; }
    .locked { border: 1px solid var(--line); background: rgba(0,0,0,.2); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #c7d3e1; font-weight: 800; white-space: nowrap; }
    .teamSelect { width: 100%; min-height: 56px; margin-bottom: 12px; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; background: #0c141d; color: inherit; padding: 8px 10px; text-align: left; cursor: pointer; }
    .teamSelect img { width: 40px; height: 40px; border-radius: 7px; object-fit: contain; background: rgba(255,255,255,.04); }
    .teamMark { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 7px; color: #64748b; font-size: 20px; font-weight: 950; }
    .teamName { display: block; min-width: 0; color: #fff; font-weight: 950; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .teamMeta { display: block; margin-top: 2px; color: #7f90a5; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .teamAction { color: #94a3b8; font-size: 12px; font-weight: 900; }
    .slots { display: grid; gap: 10px; }
    .slot { display: grid; grid-template-columns: 56px minmax(0, 1fr) 32px; align-items: center; gap: 12px; border: 1px solid var(--line); background: #0c141d; border-radius: 8px; padding: 8px; }
    .slot.blue { border-color: rgba(46,140,255,.5); } .slot.red { border-color: rgba(255,71,109,.5); }
    .portrait { width: 56px; height: 56px; border: 1px solid var(--line); background: #182331; border-radius: 8px; overflow: hidden; display: grid; place-items: center; color: #64748b; font-size: 22px; font-weight: 900; cursor: pointer; }
    .portrait img { width: 100%; height: 100%; object-fit: cover; }
    .slotMain { min-width: 0; background: none; border: 0; color: inherit; text-align: left; padding: 0; cursor: pointer; }
    .role { display: block; font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .slot.blue .role { color: var(--blue); } .slot.red .role { color: var(--red); }
    .champName { display: block; margin-top: 3px; color: #fff; font-weight: 950; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .playerName { display: block; margin-top: 2px; color: #c5d2e2; font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .statLine { display: block; margin-top: 2px; color: #7f90a5; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .clear { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: #94a3b8; font-size: 18px; cursor: pointer; }
    .clear:disabled { opacity: .25; cursor: not-allowed; }
    .center { display: grid; gap: 12px; position: sticky; top: 82px; }
    .panel { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 16px; box-shadow: 0 0 24px rgba(22,240,200,.08); }
    .panelTitle { margin: 0 0 12px; color: var(--text); font-size: 13px; font-weight: 950; letter-spacing: .14em; text-transform: uppercase; }
    .predictionEmpty { display: grid; gap: 10px; }
    .predictionButton { width: 100%; min-height: 42px; border: 0; border-radius: 7px; background: var(--cyan); color: #03100e; font-size: 13px; font-weight: 950; cursor: pointer; }
    .predictionButton:disabled { background: #263441; color: #718397; cursor: not-allowed; }
    .predictionHint { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .predictionHead { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 10px; }
    .predictionHead strong { color: #fff; font-size: 12px; }
    .predictionHead span { color: var(--muted); font-size: 10px; font-weight: 850; text-transform: uppercase; }
    .predictionNumbers { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 7px; font-size: 18px; font-weight: 950; }
    .predictionNumbers .blue { color: #9dccff; } .predictionNumbers .red { color: #ff9aae; }
    .predictionBar { height: 14px; display: flex; overflow: hidden; border: 1px solid var(--line); border-radius: 4px; background: #071019; }
    .predictionBarBlue { background: var(--blue); } .predictionBarRed { background: var(--red); }
    .featureChips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .featureChip { border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; color: #63758a; font-size: 9px; font-weight: 900; text-transform: uppercase; }
    .featureChip.ready { border-color: rgba(22,240,200,.4); color: var(--cyan); background: rgba(22,240,200,.05); }
    .summaryContext { display: flex; justify-content: space-between; gap: 8px; margin: -5px 0 10px; color: var(--muted); font-size: 10px; font-weight: 850; text-transform: uppercase; }
    .featureCompare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .featureSide { min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: #0b131c; padding: 10px; }
    .featureSide.blue { border-color: rgba(46,140,255,.4); } .featureSide.red { border-color: rgba(255,71,109,.4); }
    .featureSideName { display: block; color: #fff; font-size: 13px; font-weight: 950; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .featureSide.blue .featureSideName { color: #9dccff; } .featureSide.red .featureSideName { color: #ff9aae; }
    .featureCovered { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; font-weight: 850; text-transform: uppercase; }
    .featureStats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 9px; }
    .featureStat { min-width: 0; }
    .featureStat span { display: block; color: #718397; font-size: 8px; font-weight: 900; text-transform: uppercase; }
    .featureStat strong { display: block; margin-top: 2px; color: #fff; font-size: 15px; line-height: 1; font-weight: 950; white-space: nowrap; }
    .laneList { display: grid; gap: 8px; }
    .laneRow { display: grid; gap: 8px; border: 1px solid var(--line); background: #0c141d; border-radius: 8px; padding: 10px; }
    .laneTop { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .laneName { color: var(--cyan); font-size: 12px; font-weight: 950; letter-spacing: .08em; text-transform: uppercase; }
    .laneGame { color: #7f90a5; font-size: 10px; font-weight: 850; white-space: nowrap; }
    .laneVersus { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); gap: 7px; align-items: center; }
    .laneSide { min-width: 0; }
    .laneSide.red { text-align: right; }
    .lanePlayer { display: block; color: #fff; font-size: 11px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .laneChampion { display: block; margin-top: 2px; font-size: 13px; font-weight: 950; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .laneSide.blue .laneChampion { color: #9dccff; } .laneSide.red .laneChampion { color: #ff9aae; }
    .laneRecord { display: block; margin-top: 3px; color: #8fa1b5; font-size: 10px; font-weight: 850; white-space: nowrap; }
    .laneVs { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: #718397; font-size: 9px; font-weight: 950; }
    .laneEdge { display: flex; align-items: center; gap: 7px; }
    .lanePct { width: 34px; color: #8fa1b5; font-size: 10px; font-weight: 950; }
    .lanePct.red { text-align: right; }
    .laneBar { flex: 1; height: 7px; display: flex; overflow: hidden; border-radius: 3px; background: #071019; }
    .laneBarBlue { background: var(--blue); } .laneBarRed { background: var(--red); }
    .laneNoSample { flex: 1; color: #64748b; font-size: 9px; font-weight: 850; text-align: center; }
    .modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: start; justify-content: center; padding: 80px 16px; background: rgba(0,0,0,.72); backdrop-filter: blur(5px); }
    .modal.open { display: flex; }
    .picker { width: min(760px, 100%); border: 1px solid var(--line); border-radius: 10px; background: #0c141d; overflow: hidden; box-shadow: 0 0 30px rgba(22,240,200,.18); }
    .pickerHead { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .pickerHead h3 { margin: 0; }
    .close { border: 1px solid var(--line); background: transparent; color: #cbd5e1; border-radius: 7px; padding: 7px 10px; cursor: pointer; }
    .searchWrap { padding: 14px; border-bottom: 1px solid var(--line); }
    .search { width: 100%; border: 1px solid var(--line); background: #111b26; color: white; outline: none; padding: 12px 14px; border-radius: 8px; }
    .pickGrid { max-height: 52vh; overflow: auto; padding: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .pickButton { display: flex; align-items: center; gap: 10px; min-width: 0; border: 1px solid var(--line); background: #111b26; border-radius: 8px; padding: 8px; color: inherit; text-align: left; cursor: pointer; }
    .pickButton:disabled { opacity: .35; cursor: not-allowed; }
    .pickButton img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex: 0 0 auto; }
    .pickButton > span { min-width: 0; }
    .pickButton strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pickButton span span { display: block; color: #94a3b8; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .divider { grid-column: 1 / -1; height: 1px; margin: 4px 0; background: rgba(143,161,181,.22); }
    .leagueHeader { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin: 8px 0 0; color: var(--cyan); font-size: 11px; font-weight: 950; letter-spacing: .16em; text-transform: uppercase; }
    .leagueHeader::after { content: ""; height: 1px; flex: 1; background: rgba(143,161,181,.22); }
    @media (max-width: 1120px) { .layout { grid-template-columns: minmax(300px, 1fr) 360px minmax(300px, 1fr); } }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } .center { order: 3; position: static; } .pickGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .head { align-items: start; flex-direction: column; } }
    @media (max-width: 520px) { nav { padding-left: 10px; padding-right: 10px; gap: 8px; } .brand span { display: none; } .menu { gap: 2px; } .menu a { padding: 0 6px; font-size: 12px; } main { padding-left: 14px; padding-right: 14px; } .slot { grid-template-columns: 52px minmax(0, 1fr) 30px; gap: 9px; } .portrait { width: 52px; height: 52px; } }
  </style>

              <span class="statLine">${escapeHtml(slotStat(side, champ, index))}</span>
            </button>
            <button class="clear" data-clear="${side}:${index}" ${champ ? "" : "disabled"}>x</button>
          </div>
        `;
      }).join("");
    }
    function numericRecord(record) {
      const games = Number(record?.games ?? record?.picks ?? 0);
      const wins = Number(record?.wins || 0);
      return { games, wins, losses: Math.max(0, games - wins), winrate: games ? wins / games : null };
    }
    function smoothedPercent(record, priorGames = 6) {
      const row = numericRecord(record);
      return row.games ? ((row.wins + (priorGames * 0.5)) / (row.games + priorGames)) * 100 : null;
    }
    function weightedAverage(rows) {
      const valid = rows.filter(row => Number.isFinite(row.value) && Number(row.weight) > 0);
      const weight = valid.reduce((sum, row) => sum + row.weight, 0);
      return weight ? valid.reduce((sum, row) => sum + (row.value * row.weight), 0) / weight : null;
    }
    function sideFeatureSummary(side) {
      const selected = roles.map((_, index) => ({ player: playerForRole(side, index), champ: state[side][index] }));
      const rows = selected.map(row => playerChampionStat(row.player, row.champ)).filter(Boolean);
      const picks = rows.reduce((sum, row) => sum + numericRecord(row).games, 0);
      const wins = rows.reduce((sum, row) => sum + numericRecord(row).wins, 0);
      return { covered: rows.length, picks, wins, winrate: picks ? wins / picks : null, rows };
    }
    function teamSummaryRecord(side) {
      const team = state.selectedTeams[side];
      const keys = new Set([team?.name, team?.team, team?.code, teamDisplayCode(team)].map(normalize).filter(Boolean));
      const rows = selectedSummaryBucket()?.teams?.length ? selectedSummaryBucket().teams : (state.summaryData?.teams || []);
      return rows.find(row => keys.has(normalize(row.name))) || null;
    }
    function championSummaryRecord(champ, index) {
      if (!champ) return null;
      const bucket = selectedSummaryBucket();
      const rows = bucket?.champions_by_role?.[roleKeys[index]] || bucket?.champions || [];
      return rows.find(row => normalize(row.name) === normalize(champ.name)) || null;
    }
    function sidePlayerRating(side) {
      const rows = roles.map((_, index) => playerChampionStat(playerForRole(side, index), state[side][index])).filter(Boolean);
      return weightedAverage(rows.map(row => ({ value: smoothedPercent(row, 4), weight: Math.min(3, Math.sqrt(numericRecord(row).games)) })));
    }
    function sideChampionRating(side) {
      const rows = roles.map((_, index) => championSummaryRecord(state[side][index], index)).filter(Boolean);
      return weightedAverage(rows.map(row => ({ value: smoothedPercent(row, 10), weight: Math.min(4, Math.sqrt(numericRecord(row).games)) })));
    }
    function laneMetric(index, smooth = false) {
      const blueRecord = matchupRecord("blue", index);
      const redRecord = matchupRecord("red", index);
      const blueStats = numericRecord(blueRecord);
      const redStats = numericRecord(redRecord);
      const samples = [];
      if (blueStats.games) samples.push({
        value: smooth ? smoothedPercent(blueRecord, 4) : blueStats.winrate * 100,
        weight: Math.sqrt(blueStats.games),
      });
      if (redStats.games) samples.push({
        value: 100 - (smooth ? smoothedPercent(redRecord, 4) : redStats.winrate * 100),
        weight: Math.sqrt(redStats.games),
      });
      return {
        blueRecord, redRecord, blueStats, redStats,
        available: samples.length > 0,
        blue: Math.max(0, Math.min(100, weightedAverage(samples) ?? 50)),
      };
    }
    function featurePrediction() {
      const components = [];
      const inputs = [];
      const addPair = (label, blueRating, redRating, weight) => {
        const available = Number.isFinite(blueRating) && Number.isFinite(redRating);
        components.push({ label, available });
        if (available) inputs.push({ value: 50 + ((blueRating - redRating) * 0.5), weight });
      };
      addPair("Team form (overall)", smoothedPercent(teamSummaryRecord("blue"), 12), smoothedPercent(teamSummaryRecord("red"), 12), 4);
      addPair("Player champion", sidePlayerRating("blue"), sidePlayerRating("red"), 3);
      addPair("Champion meta", sideChampionRating("blue"), sideChampionRating("red"), 2);
      const laneBlue = weightedAverage(roles.map((_, index) => laneMetric(index, true)).filter(row => row.available).map(row => ({
        value: row.blue,
        weight: Math.min(3, Math.sqrt(row.blueStats.games + row.redStats.games)),
      })));
      components.push({ label: "Lane matchup", available: Number.isFinite(laneBlue) });
      if (Number.isFinite(laneBlue)) inputs.push({ value: laneBlue, weight: 2 });
      const rawBlue = weightedAverage(inputs) ?? 50;
      const blue = Math.max(10, Math.min(90, rawBlue));
      return { blue, red: 100 - blue, components, available: inputs.length > 0 };
    }
    function predictionReady() {
      return Boolean(state.selectedTeams.blue && state.selectedTeams.red
        && state.blue.every(Boolean) && state.red.every(Boolean)
        && state.featureData && state.summaryData);
    }
    function predictionHint() {
      if (!state.selectedTeams.blue || !state.selectedTeams.red) return "Select both teams to include team and roster features.";
      if (![...state.blue, ...state.red].every(Boolean)) return "Fill all ten champion slots to calculate.";
      if (!state.featureData || !state.summaryData) return "Loading filtered feature data...";
      return "Team, player, champion, and lane samples are ready.";
    }
    function renderPrediction() {
      const ready = predictionReady();
      if (!state.calculated) {
        $("lensPrediction").innerHTML = `
          <h2 class="panelTitle">Draft Lens Prediction</h2>
          <div class="predictionEmpty">
            <button class="predictionButton" id="calculateLens" ${ready ? "" : "disabled"}>Calculate Win Rate</button>
            <p class="predictionHint">${escapeHtml(predictionHint())}</p>
          </div>
        `;
        return;
      }
      const result = featurePrediction();
      const blueName = teamDisplayCode(state.selectedTeams.blue);
      const redName = teamDisplayCode(state.selectedTeams.red);
      const covered = result.components.filter(component => component.available).length;
      $("lensPrediction").innerHTML = `
        <h2 class="panelTitle">Draft Lens Prediction</h2>
        <div class="predictionHead"><strong>${escapeHtml(blueName)} vs ${escapeHtml(redName)}</strong><span>${covered}/${result.components.length} features</span></div>
        <div class="predictionNumbers"><span class="blue">${result.blue.toFixed(1)}%</span><span class="red">${result.red.toFixed(1)}%</span></div>
        <div class="predictionBar" aria-label="${escapeHtml(blueName)} ${result.blue.toFixed(1)}%, ${escapeHtml(redName)} ${result.red.toFixed(1)}%">
          <span class="predictionBarBlue" style="width:${result.blue}%"></span>
          <span class="predictionBarRed" style="width:${result.red}%"></span>
        </div>
        <div class="featureChips">${result.components.map(component => `<span class="featureChip ${component.available ? "ready" : ""}">${escapeHtml(component.label)}</span>`).join("")}</div>
        <p class="predictionHint">Team form uses the tier scope overall; player, champion, and lane features use the selected patch.</p>
      `;
    }
    function renderFeatureSide(side) {
      const summary = sideFeatureSummary(side);
      const team = state.selectedTeams[side];
      return `
        <div class="featureSide ${side}">
          <span class="featureSideName">${escapeHtml(team ? teamDisplayCode(team) : side.toUpperCase())}</span>
          <span class="featureCovered">${summary.covered}/5 champion samples</span>
          <div class="featureStats">
            <div class="featureStat"><span>Picks</span><strong>${summary.picks}</strong></div>
            <div class="featureStat"><span>Wins</span><strong>${summary.wins}</strong></div>
            <div class="featureStat"><span>WR</span><strong>${summary.winrate === null ? "-" : pct(summary.winrate)}</strong></div>
          </div>
        </div>
      `;
    }
    function renderSummary() {
      $("featureSummary").innerHTML = `
        <h2 class="panelTitle">Player Features</h2>
        <div class="summaryContext"><span>${escapeHtml(state.statTier.toUpperCase())}</span><span>${escapeHtml(patchLabel(state.statPatch))}</span></div>
        <div class="featureCompare">${renderFeatureSide("blue")}${renderFeatureSide("red")}</div>
      `;
    }
    function recordLabel(record) {
      const row = numericRecord(record);
      return row.games ? `${row.wins}-${row.losses} / ${pct(row.winrate)} / ${row.games}G` : "No sample";
    }
    function renderLaneMatchups() {
      $("laneMatchups").innerHTML = `
        <h2 class="panelTitle">Lane Matchups</h2>
        <div class="laneList">
          ${roles.map((role, index) => {
            const bluePlayer = playerForRole("blue", index);
            const redPlayer = playerForRole("red", index);
            const blueChamp = state.blue[index];
            const redChamp = state.red[index];
            const metric = laneMetric(index);
            const blueWidth = metric.available ? metric.blue : 50;
            const redWidth = 100 - blueWidth;
            return `
              <div class="laneRow">
                <div class="laneTop"><div class="laneName">${role}</div><div class="laneGame">B ${metric.blueStats.games}G / R ${metric.redStats.games}G</div></div>
                <div class="laneVersus">
                  <div class="laneSide blue">
                    <span class="lanePlayer">${escapeHtml(bluePlayer?.player || "Blue player")}</span>
                    <span class="laneChampion">${escapeHtml(blueChamp?.name || "No champion")}</span>
                    <span class="laneRecord">${escapeHtml(recordLabel(metric.blueRecord))}</span>
                  </div>
                  <div class="laneVs">VS</div>
                  <div class="laneSide red">
                    <span class="lanePlayer">${escapeHtml(redPlayer?.player || "Red player")}</span>
                    <span class="laneChampion">${escapeHtml(redChamp?.name || "No champion")}</span>
                    <span class="laneRecord">${escapeHtml(recordLabel(metric.redRecord))}</span>
                  </div>
                </div>
                <div class="laneEdge">
                  ${metric.available ? `
                    <span class="lanePct">${blueWidth.toFixed(0)}%</span>
                    <div class="laneBar" aria-label="${role} blue perspective ${blueWidth.toFixed(1)}%">
                      <span class="laneBarBlue" style="width:${blueWidth}%"></span>
                      <span class="laneBarRed" style="width:${redWidth}%"></span>
                    </div>
                    <span class="lanePct red">${redWidth.toFixed(0)}%</span>
                  ` : `<span class="laneNoSample">No direct player matchup sample</span>`}
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }
    function render() {
      renderTeamSelect("blue");
      renderTeamSelect("red");
      renderSlots("blue");
      renderSlots("red");
      const blue = state.blue.filter(Boolean).length;
      const red = state.red.filter(Boolean).length;
      $("blueCount").textContent = `${blue}/5 locked`;
      $("redCount").textContent = `${red}/5 locked`;
      $("count").textContent = `${blue + red}/10 champions selected`;
      renderPrediction();
      renderSummary();
      renderLaneMatchups();
      const calculate = $("calculateLens");
      if (calculate) calculate.onclick = () => { state.calculated = true; render(); };
      document.querySelectorAll("[data-team-side]").forEach(button => button.onclick = () => openTeamPicker(button.dataset.teamSide));
      document.querySelectorAll("[data-open-champ]").forEach(button => button.onclick = () => openChampionPicker(button.dataset.openChamp));
      document.querySelectorAll("[data-clear]").forEach(button => button.onclick = () => {
        const [side, index] = button.dataset.clear.split(":");
        state[side][Number(index)] = null;
        state.calculated = false;
        render();
      });
    }
    function openChampionPicker(value) {
      const [side, index] = value.split(":");
      state.pickerMode = "champion";
      state.active = { side, index: Number(index) };
      state.query = "";
      $("search").value = "";
      $("modal").classList.add("open");
      renderPicker();
      setTimeout(() => $("search").focus(), 0);
    }
    function openTeamPicker(side) {
      state.pickerMode = "team";
      state.active = { side, index: null };
      state.query = "";
      $("search").value = "";
      $("modal").classList.add("open");
      renderPicker();
      setTimeout(() => $("search").focus(), 0);
    }
    function renderPicker() {
      if (state.pickerMode === "team") return renderTeamPicker();
      $("modalTitle").textContent = "Select Champion";
      $("modalHint").textContent = "Search by champion name or role.";
      $("search").placeholder = "Search champions...";
      const selected = new Set([...state.blue, ...state.red].filter(Boolean).map(champ => champ.id));
      const q = state.query.trim().toLowerCase();
      const targetRole = roles[state.active?.index ?? 0];
      const list = champions.filter(champ => !q || champ.name.toLowerCase().includes(q) || champ.role.toLowerCase().includes(q));
      const sameRole = list.filter(champ => champ.role === targetRole);
      const otherRoles = list.filter(champ => champ.role !== targetRole);
      const button = champ => `<button class="pickButton" data-champ="${champ.id}" ${selected.has(champ.id) ? "disabled" : ""}><img src="${escapeHtml(champ.imageUrl)}" alt=""><span><strong>${escapeHtml(champ.name)}</strong><span>${escapeHtml(champ.role)}</span></span></button>`;
      $("pickGrid").innerHTML = [...sameRole.map(button), sameRole.length && otherRoles.length ? `<div class="divider"></div>` : "", ...otherRoles.map(button)].join("");
      document.querySelectorAll("[data-champ]").forEach(button => button.onclick = () => {
        const champ = champions.find(row => row.id === button.dataset.champ);
        if (!champ || !state.active) return;
        state[state.active.side][state.active.index] = champ;
        state.calculated = false;
        $("modal").classList.remove("open");
        render();
      });
    }
    function renderTeamPicker() {
      $("modalTitle").textContent = "Select Team";
      $("modalHint").textContent = "Grouped by league. Search by team, code, or league.";
      $("search").placeholder = "Search teams...";
      const q = state.query.trim().toLowerCase();
      const teams = state.teams.filter(team => !q || `${team.name} ${team.code} ${team.team} ${team.league_label || team.league || ""}`.toLowerCase().includes(q));
      const grouped = new Map();
      for (const team of teams) {
        const league = team.league_label || team.league || "Other";
        if (!grouped.has(league)) grouped.set(league, []);
        grouped.get(league).push(team);
      }
      $("pickGrid").innerHTML = teams.length ? [...grouped.entries()].map(([league, rows]) => `
        <div class="leagueHeader">${escapeHtml(league)}</div>
        ${rows.map(team => `
          <button class="pickButton" data-team="${escapeHtml(team.file)}">
            ${team.logo ? `<img src="${escapeHtml(team.logo)}" alt="">` : `<span class="teamMark">+</span>`}
            <span><strong>${escapeHtml(teamDisplayCode(team))}</strong><span>${escapeHtml(team.name || team.team)}</span></span>
          </button>
        `).join("")}
      `).join("") : `<div class="hint">No teams found.</div>`;
      document.querySelectorAll("[data-team]").forEach(button => button.onclick = () => {
        const team = state.teams.find(row => row.file === button.dataset.team);
        if (!team || !state.active?.side) return;
        $("modal").classList.remove("open");
        selectTeam(state.active.side, team);
      });
    }
    $("search").oninput = event => { state.query = event.target.value; renderPicker(); };
    $("close").onclick = () => $("modal").classList.remove("open");
    $("modal").onclick = event => { if (event.target.id === "modal") $("modal").classList.remove("open"); };
    $("statTierFilter").onchange = event => {
      state.statTier = event.target.value || "all";
      state.calculated = false;
      refreshActiveFeatureBucket();
      loadSummaryData();
    };
    $("statPatchFilter").onchange = event => {
      state.statPatch = event.target.value || "ALL";
      state.calculated = false;
      refreshActiveFeatureBucket();
      loadSummaryData();
    };
    render();
    renderFilters();
    loadTeams();
    loadFeatureData();
    loadChampionData();
  </script>
</body>
</html>
