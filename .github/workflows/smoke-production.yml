name: Smoke production contracts

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Cloudflare Pages base URL"
        required: true
        default: "https://lol-predictor.pages.dev"
      event_id:
        description: "LoL Esports event ID to probe"
        required: true
        default: "test"
      expected_contract_version:
        description: "Expected site-contract.json version"
        required: true
        default: "2026-05-20-live-pre-match-diagnostics-v1"
      prediction_feed_url:
        description: "Public pre-match prediction JSON URL"
        required: false
        default: "https://lol-predictor.pages.dev/pre_match_predictions.json"
      prediction_ui_min_rows:
        description: "Minimum prediction rows required by the UI feed contract check"
        required: true
        default: "0"
      prediction_ui_min_overlap:
        description: "Minimum prediction/match overlap rows required by the UI feed contract check"
        required: true
        default: "0"
      live_status_url:
        description: "Public live_status.json URL"
        required: false
        default: "https://lol-predictor.pages.dev/live_status.json"
      live_manifest_url:
        description: "Public live_model_manifest.json URL"
        required: false
        default: "https://lol-predictor.pages.dev/live_model_manifest.json"
      require_live_win_probability:
        description: "Fail if the probed event does not include live.win_probability"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://lol-predictor.pages.dev' }}
      EVENT_ID: ${{ github.event.inputs.event_id || 'test' }}
      EXPECTED_CONTRACT_VERSION: ${{ github.event.inputs.expected_contract_version || '2026-05-20-live-pre-match-diagnostics-v1' }}
      PREDICTION_FEED_URL: ${{ github.event.inputs.prediction_feed_url || 'https://lol-predictor.pages.dev/pre_match_predictions.json' }}
      PREDICTION_UI_MIN_ROWS: ${{ github.event.inputs.prediction_ui_min_rows || '1' }}
      PREDICTION_UI_MIN_OVERLAP: ${{ github.event.inputs.prediction_ui_min_overlap || '1' }}
      LIVE_STATUS_URL: ${{ github.event.inputs.live_status_url || 'https://lol-predictor.pages.dev/live_status.json' }}
      LIVE_MANIFEST_URL: ${{ github.event.inputs.live_manifest_url || 'https://lol-predictor.pages.dev/live_model_manifest.json' }}
      REQUIRE_LIVE_WIN_PROBABILITY: ${{ github.event.inputs.require_live_win_probability || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check production contracts
        run: |
          node scripts/check_cloudflare_pages.mjs \
            --base-url "$BASE_URL" \
            --event-id "$EVENT_ID" \
            --expected-contract-version "$EXPECTED_CONTRACT_VERSION" \
            --prediction-feed-url "$PREDICTION_FEED_URL" \
            --live-status-url "$LIVE_STATUS_URL" \
            --live-manifest-url "$LIVE_MANIFEST_URL" \
            --require-live-win-probability "$REQUIRE_LIVE_WIN_PROBABILITY"
          node scripts/check_pre_match_ui.mjs \
            --base-url "$BASE_URL" \
            --prediction-feed-url "$PREDICTION_FEED_URL" \
            --min-rows "$PREDICTION_UI_MIN_ROWS" \
            --min-overlap "$PREDICTION_UI_MIN_OVERLAP"
