name: Collect live event snapshots

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      event_id:
        description: "Optional LoL Esports event ID to force-collect"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect-live-event-snapshots
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cloudflare Pages branch
        uses: actions/checkout@v4
        with:
          ref: codex/github-pages-static
          fetch-depth: 0

      - name: Collect snapshots
        env:
          SITE_BASE_URL: https://lol-predictor.pages.dev
          EVENT_ID: ${{ github.event.inputs.event_id }}
        run: |
          args=()
          if [ -n "$EVENT_ID" ]; then
            args+=(--event-id "$EVENT_ID")
          fi
          node scripts/collect_live_event_snapshots.mjs "${args[@]}"

      - name: Commit updated snapshot artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/static/data/live-event-snapshots .github/live-event-snapshot-state.json
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git commit -m "Update live event snapshot artifacts"
          git push origin HEAD:codex/github-pages-static
