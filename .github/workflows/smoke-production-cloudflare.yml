name: Smoke Cloudflare production

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Cloudflare Pages base URL"
        required: true
        default: "https://lol-predictor.pages.dev"
      event_id:
        description: "LoL Esports event ID to probe"
        required: true
        default: "test"
      min_prediction_rows:
        description: "Minimum pre-match prediction rows"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://lol-predictor.pages.dev' }}
      EVENT_ID: ${{ github.event.inputs.event_id || 'test' }}
      MIN_PREDICTION_ROWS: ${{ github.event.inputs.min_prediction_rows || '1' }}

    steps:
      - name: Check production endpoints
        shell: bash
        run: |
          node <<'NODE'
          const baseUrl = process.env.BASE_URL.replace(/\/+$/, '');
          const eventId = process.env.EVENT_ID || 'test';
          const minRows = Number(process.env.MIN_PREDICTION_ROWS || 1);

          async function fetchJson(path) {
            const url = path.startsWith('http') ? path : `${baseUrl}${path}`;
            const response = await fetch(url, { headers: { accept: 'application/json' } });
            const text = await response.text();
            let json = null;
            try {
              json = JSON.parse(text);
            } catch {
              throw new Error(`${url} did not return JSON: status=${response.status} body=${text.slice(0, 200)}`);
            }
            if (!response.ok) {
              throw new Error(`${url} returned status ${response.status}: ${text.slice(0, 200)}`);
            }
            return { url, json };
          }

          const diagnostics = await fetchJson('/api/diagnostics');
          const liveEvent = await fetchJson(`/api/live-event?id=${encodeURIComponent(eventId)}`);
          const predictions = await fetchJson('/pre_match_predictions.json');
          const liveStatus = await fetchJson('/live_status.json');
          const liveManifest = await fetchJson('/live_model_manifest.json');

          const errors = [];
          const warnings = [];
          const diag = diagnostics.json;
          const feed = predictions.json;
          const status = liveStatus.json;
          const manifest = liveManifest.json;

          if (diag.ok !== true) errors.push('diagnostics.ok is not true');
          if (diag.contract_ok !== true) errors.push('diagnostics.contract_ok is not true');
          if (diag.prediction_feed_available !== true) errors.push('diagnostics prediction feed unavailable');
          if (diag.prediction_feed_rows < minRows) errors.push(`diagnostics prediction rows ${diag.prediction_feed_rows} < ${minRows}`);
          if (diag.prediction_schema_ok !== true) errors.push('diagnostics prediction schema is not ok');
          if (diag.live_model_available !== true) errors.push('diagnostics live model unavailable');
          if (!diag.deployment_commit_sha) errors.push('diagnostics deployment commit sha missing');
          if (diag.warnings?.length) warnings.push(...diag.warnings.map((warning) => `diagnostics: ${warning}`));
          if (diag.artifact_warnings?.length) warnings.push(...diag.artifact_warnings.map((warning) => `artifact: ${warning}`));

          const predictionRows = Array.isArray(feed.predictions) ? feed.predictions.length : Array.isArray(feed) ? feed.length : 0;
          if (feed.schema !== 'lol_predictions_public_v1') errors.push(`prediction feed schema mismatch: ${feed.schema}`);
          if (predictionRows < minRows) errors.push(`prediction feed rows ${predictionRows} < ${minRows}`);

          if (!liveEvent.json || typeof liveEvent.json !== 'object') errors.push('live-event response is not an object');
          if (!Array.isArray(liveEvent.json.games)) errors.push('live-event response is missing games array');
          if (status.display_ready !== true) warnings.push(`live_status display_ready=${status.display_ready}`);
          if (status.production_ready !== true) warnings.push(`live_status production_ready=${status.production_ready}`);
          if (manifest.live_model?.available === false) warnings.push('analyzer live manifest primary model unavailable');

          const summary = {
            ok: errors.length === 0,
            base_url: baseUrl,
            event_id: eventId,
            deployment_commit_sha: diag.deployment_commit_sha,
            prediction_rows: predictionRows,
            diagnostics_feed_rows: diag.prediction_feed_rows,
            prediction_feed_freshness: diag.prediction_feed_freshness,
            live_status_stage: status.stage || diag.live_status_stage,
            live_model_name: diag.live_model_name,
            errors,
            warnings,
          };
          console.log(JSON.stringify(summary, null, 2));
          if (errors.length) process.exit(1);
          NODE
